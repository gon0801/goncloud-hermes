name: goncloud-team
version: 0.1.0
description: Durable Goncloud engineering workflow and peer consultations on native Hermes Kanban.
author: Goncloud
kind: standalone
platforms:
  - windows
provides_tools:
  - goncloud_engineering_start
  - goncloud_engineering_status
  - goncloud_consult
  - goncloud_engineering_review
  - goncloud_muse_delegate
  - goncloud_subscription_run
  - goncloud_subscription_status
  - goncloud_local_run
  - goncloud_local_status
  - goncloud_local_close
  - goncloud_root_submit
  - goncloud_root_read
  - goncloud_root_control
  - goncloud_root_resolve
  - goncloud_root_instruction_put
  - goncloud_root_reconcile
provides_hooks:
  - pre_tool_call
  - post_tool_call
  - pre_llm_call
  - post_llm_call
  - transform_llm_output
  - post_gateway_admission
config_schema:
  jev_umbral:
    type: float
    default: 0.85
    description: Probabilidad mínima de JEV para actuar con su respuesta; por debajo gana la regla actual
  jev_timeout_seconds:
    type: float
    default: 3.0
    description: Tope de cada consulta a TypeSafe; al vencer gana la regla actual
  jev_router_clasificacion:
    type: bool
    default: true
    description: Interruptor del punto router_clasificacion (clasificación de fallas del router de suscripciones)
  jev_muse_bridge_clasificacion:
    type: bool
    default: true
    description: Interruptor del punto muse_bridge_clasificacion (clasificación de fallas de la delegación a Muse)
  jev_ticker_incidencia:
    type: bool
    default: true
    description: Interruptor del punto ticker_incidencia (transporte caído vs resultado inválido en el ticker de raíces)
  jev_avance_rapido:
    type: bool
    default: true
    description: Interruptor de la respuesta rápida de "cómo va" (post_gateway_admission; sin LLM, solo claw en Telegram DM)
  jev_registro:
    type: str
    default: ""
    description: Ruta del registro jev/decisiones.jsonl; vacío usa <home del perfil o del root>/jev/decisiones.jsonl
